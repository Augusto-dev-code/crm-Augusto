
<!DOCTYPE html>
<html>
<head>
    <title>Editar Cliente</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>
<body>

<div class="container">

    <div class="sidebar">

        <h2>🚀 ZyronDev</h2>

        <a href="/">📊 Dashboard</a>
        <a href="/clientes">👥 Clientes</a>
        <a href="/cadastro">➕ Novo Cliente</a>
        <a href="/logout">🚪 Sair</a>

    </div>

    <div class="content">

        <h1>✏️ Editar Cliente</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for categoria, mensagem in messages %}
                    <div class="alerta {{ categoria }}">
                        {{ mensagem }}
                    </div>
                    <br>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/atualizar/{{ cliente[0] }}" method="POST">

            <input
                type="text"
                name="nome"
                value="{{ cliente[1] }}"
                placeholder="Nome do cliente"
                required
            >

            <input
                type="text"
                name="telefone"
                value="{{ cliente[2] }}"
                placeholder="Telefone"
                required
            >

            <textarea
                name="observacoes"
                placeholder="Observações"
                rows="5"
            >{{ cliente[3] }}</textarea>

            <input
                type="number"
                step="0.01"
                min="0"
                name="valor"
                value="{{ cliente[5] }}"
                placeholder="Valor (R$)"
                required
            >

            <label for="tipo_valor">Tipo de cobrança</label>

            <select name="tipo_valor" id="tipo_valor" required>

                <option value="fixo"
                    {% if cliente[7] == 'fixo' %}selected{% endif %}>
                    Pagamento único (valor fixo)
                </option>

                <option value="mensal"
                    {% if cliente[7] == 'mensal' %}selected{% endif %}>
                    Pagamento recorrente (mensal)
                </option>

            </select>

            <button type="submit">
                💾 Salvar Alterações
            </button>

        </form>

    </div>

</div>

</body>
</html>
